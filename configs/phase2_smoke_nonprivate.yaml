experiment_name: phase2_cifar10_multiclass_cnn
seed: 20260830

data:
  backend: cifar10_multiclass
  dataset_root: data
  download: true
  n_clients: 20
  samples_per_client: 200
  # Symmetric Dirichlet(alpha) over the 10 classes per client. Smaller alpha is
  # more non-IID (label-skewed); alpha=100 is close to IID. This replaces the
  # binary-flip heterogeneity knob used by the cifar10_binary backend.
  heterogeneity_alpha: 0.5
  audit_samples: 50
  test_samples: 2000

model:
  name: small_groupnorm_cnn
  num_classes: 10

federated:
  rounds: 50
  local_epochs: 5
  local_batch_size: 32
  learning_rate: 0.1
  client_sample_rate: 0.5

privacy:
  enabled: false
  population_size: 20
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 1.1
  sampling: poisson
  release_count: 1

deletion:
  kind: client
  client_id: 2

unlearning:
  method: finetune_retained
  rounds: 4

output:
  root: results

notes: >
  Phase 2 feasibility config: real 10-class CIFAR-10 with a small GroupNorm CNN
  and client-level central DP. This is a first non-linear-model checkpoint, not
  the final published grid -- rounds/lr/clip_norm are untuned starting points and
  should be revisited once a GPU is available (this config is CPU-runnable but
  slow at these image sizes; use --limit 1 for a smoke test first).
