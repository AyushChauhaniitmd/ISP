# Phase 2 feasibility grid: 10-class CIFAR-10 with a small GroupNorm CNN.
# Deliberately smaller than the eventual confirmatory grid (fewer epsilons,
# fewer seeds) so it is affordable to run once as a first CNN checkpoint
# before committing to the full Phase 3 confirmation-seed sweep.
base_config: configs/phase2_cifar10_multiclass_cnn.yaml
target_epsilons: [4.0, 8.0, inf]
heterogeneity: [0.5]
deletion_client_ids: [2]
seeds: [20260920, 20260921, 20260922]
execution_order: epsilon_then_heterogeneity_then_seed
note: >
  First real-CNN, 10-class Phase 2 checkpoint grid. Uses the same accountant-
  aligned fixed-normalizer Poisson mechanism as the Phase 1 v2 grid. This is a
  feasibility/direction check, not the final published Phase 2 benchmark grid --
  expand seeds and the epsilon set once training time/compute is confirmed on
  your hardware.
