experiment_name: phase1_cifar10_binary_client_dp_cpu
seed: 20260830

data:
  backend: cifar10_binary
  dataset_root: data
  download: false
  n_clients: 12
  samples_per_client: 100
  # Fixed public average pooling: 3 x 8 x 8 = 192-dimensional features.
  n_features: 192
  feature_pool_kernel: 4
  heterogeneity: 0.75
  audit_samples: 400
  test_samples: 1000

federated:
  rounds: 12
  local_epochs: 1
  local_batch_size: 32
  learning_rate: 0.05
  client_sample_rate: 0.5

privacy:
  enabled: true
  population_size: 12
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 1.1
  sampling: poisson
  release_count: 1

deletion:
  kind: client
  client_id: 2

unlearning:
  method: finetune_retained
  rounds: 4

output:
  root: results
