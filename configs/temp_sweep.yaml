data:
  audit_samples: 50
  backend: cifar10_multiclass
  dataset_root: data
  download: true
  heterogeneity_alpha: 0.5
  n_clients: 100
  samples_per_client: 200
  test_samples: 2000
deletion:
  client_id: 2
  kind: client
evaluation:
  retrain_ensemble_size: 1
experiment_name: phase2_cifar10_multiclass_cnn
federated:
  client_sample_rate: 1.0
  learning_rate: 0.5
  local_batch_size: 32
  local_epochs: 5
  rounds: 100
model:
  name: small_groupnorm_cnn
  num_classes: 10
notes: 'Phase 2 feasibility config: real 10-class CIFAR-10 with a small GroupNorm
  CNN and client-level central DP. This is a first non-linear-model checkpoint, not
  the final published grid -- rounds/lr/clip_norm are untuned starting points and
  should be revisited once a GPU is available (this config is CPU-runnable but slow
  at these image sizes; use --limit 1 for a smoke test first).

  '
output:
  root: results
privacy:
  clip_norm: 1.0
  delta: 1.0e-05
  enabled: true
  noise_multiplier: 0.1
  population_size: 100
  release_count: 1
  sampling: poisson
seed: 20260830
unlearning:
  method: finetune_retained
  rounds: 4
