experiment_name: phase0_partial_sequential_client_dp
seed: 20260901

data:
  backend: synthetic
  n_clients: 12
  samples_per_client: 80
  n_features: 8
  heterogeneity: 0.85
  test_samples: 600

federated:
  rounds: 12
  local_epochs: 1
  local_batch_size: 16
  learning_rate: 0.15
  client_sample_rate: 0.5

privacy:
  enabled: true
  population_size: 12
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 1.1
  sampling: poisson
  release_count: 1

deletion:
  kind: cumulative_client_requests
  # Cumulative target: 25% of client 2, all of client 5, then 50% of client 8.
  # This config evaluates the state after the listed request sequence.
  requests:
    - client_id: 2
      fraction: 0.25
    - client_id: 5
      fraction: 1.0
    - client_id: 8
      fraction: 0.50

unlearning:
  method: finetune_retained
  rounds: 4

output:
  root: results
