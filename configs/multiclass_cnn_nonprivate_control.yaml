experiment_name: multiclass_cnn_nonprivate_control
seed: 20260918

data:
  backend: cifar10_multiclass
  dataset_root: data
  download: true
  n_clients: 100
  samples_per_client: 200
  heterogeneity_alpha: 0.5
  audit_samples: 500
  test_samples: 10000

model:
  name: small_groupnorm_cnn
  num_classes: 10

execution:
  require_cuda: true

federated:
  rounds: 60
  local_epochs: 3
  local_batch_size: 64
  learning_rate: 0.05
  client_sample_rate: 0.5

privacy:
  enabled: false
  population_size: 100
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 0.0
  sampling: poisson
  release_count: 1

evaluation:
  epsilons: [inf]
  seeds: [20260918, 20260919, 20260920]
  validity_threshold_invalid: 0.25
  validity_threshold_warning: 0.40

deletion:
  kind: client
  client_id: 2

unlearning:
  method: none
  rounds: 0

output:
  root: results/utility_sweep_cnn_nonprivate