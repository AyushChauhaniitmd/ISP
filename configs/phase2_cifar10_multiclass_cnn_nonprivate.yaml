experiment_name: phase2_cifar10_multiclass_cnn_nonprivate
seed: 20260830

data:
  backend: cifar10_multiclass
  dataset_root: data
  download: false
  n_clients: 20
  samples_per_client: 200
  heterogeneity_alpha: 0.5
  audit_samples: 500
  test_samples: 2000

model:
  name: small_groupnorm_cnn
  num_classes: 10

federated:
  rounds: 30
  local_epochs: 1
  local_batch_size: 32
  learning_rate: 0.02
  client_sample_rate: 0.5

privacy:
  enabled: false
  population_size: 20
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 0.0
  sampling: poisson
  release_count: 1

deletion:
  kind: client
  client_id: 2

unlearning:
  method: finetune_retained
  rounds: 4

output:
  root: results

notes: >
  Non-private reference twin of phase2_cifar10_multiclass_cnn.yaml, same data/
  model/deletion/seed. Used as the epsilon=inf reference point in the redundancy
  screen, mirroring the phase1_cifar10_binary_nonprivate_cpu.yaml pattern.
